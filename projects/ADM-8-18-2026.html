<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arvi Jay</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="shortcut icon" href="../assets/favicon-16x16.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../components/load.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .container {
            /* position (needed for z-index) */
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            /* z-index */
            z-index: 1;
        }

        .container img {
            position: relative;
            z-index: -1;
            /* The value of this z-index allows it to move at the back */
        }

        /* others */

        * {
            font-weight: bold;
        }

        .container {
            width: fit-content;
        }

        .overlay {
            border-radius: 19px;
            width: 100%;
            padding: 20px 0;
            backdrop-filter: blur(10px);
            border: 2px dashed white;
        }

        .container img {
            border-radius: 20px;
            box-shadow: 0 0 10px black;
        }

        .overlay>div {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="w-full h-dvh flex items-center justify-center text-white text-shadow-lg">
        <div
            class="bg-black/60 backdrop-blur-sm w-[90%] h-[90%] border-[5px] border-white/20 rounded-[70px] flex flex-col p-5">

            <div id="navbar"></div>

            <div class="flex flex-col items-center justify-start flex-1 overflow-y-auto">
                <div class="text-shadow-lg text-white w-full">

                    <!-- Content -->
                    <div class="flex flex-row items-center justify-center w-full h-[350px]">
                        <div class="container">
                            <div class="overlay">
                                <div>This text overlays the image</div>
                            </div>
                            <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="Cinque Terre" width="400">
                        </div>
                    </div>

                </div>

                <a href="./index.html"
                    class="hover:bg-white w-fit my-5 hover:text-black bg-black text-white hover:scale-110 transition-all py-2 px-4 rounded-full flex items-center gap-2">
                    <i class="fa-solid fa-caret-left"></i> Go Back
                </a>
            </div>

        </div>
    </div>

    <div
        class="loading fixed top-0 left-0 right-0 bottom-0 bg-black z-99999 flex flex-col gap-5 items-center justify-center ">
        <img src="../assets/android-chrome-192x192.png" alt="image" class="animate-picture">
    </div>

    <script>
        initLoadingScreen()
        loadComponent("navbar", "../components/navbar.html", {
            title: "ADM",
            imagePath: "../assets/Tungpalan, Arvi Jay B.jpg"
        })
    </script>
</body>

</html>

</html>
